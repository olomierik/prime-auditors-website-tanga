<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShuleConnect" />
    <title>ShuleConnect – Elohim Education Centre</title>
    <meta name="description" content="ShuleConnect — closed school network for students, parents, and teachers at Elohim Education Centre, Tanga." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;background:#f8fafc">
    <div id="root" style="background-color:#ffffff"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        /* 1. Immediate CSS — hides Lovable badge before JS even runs */
        var s = document.createElement('style');
        s.textContent =
          '[class*="lovable" i],[id*="lovable" i],[data-lovable],' +
          'a[href*="lovable.app"],a[href*="lovable.dev"],' +
          'iframe[src*="lovable"],' +
          'script[src*="lovable"] ~ div {' +
          '  display:none!important;opacity:0!important;pointer-events:none!important;' +
          '}';
        (document.head || document.documentElement).appendChild(s);

        /* 2. DOM removal — text + href sweeps */
        function purge() {
          try {
            /* by text content */
            document.querySelectorAll('a,button,span,div,p').forEach(function (el) {
              if ((el.innerText || el.textContent || '').toLowerCase().indexOf('edit with lovable') !== -1) {
                var t = el;
                for (var i = 0; i < 10; i++) {
                  if (!t || t === document.body) break;
                  var p = window.getComputedStyle(t).position;
                  if (p === 'fixed' || p === 'absolute') { t.remove(); return; }
                  t = t.parentElement;
                }
                el.style.cssText = 'display:none!important';
              }
            });
            /* by href pointing to lovable */
            document.querySelectorAll('a[href*="lovable"]').forEach(function (el) {
              var t = el;
              for (var i = 0; i < 10; i++) {
                if (!t || t === document.body) break;
                var p = window.getComputedStyle(t).position;
                if (p === 'fixed' || p === 'absolute') { t.remove(); return; }
                t = t.parentElement;
              }
              el.style.cssText = 'display:none!important';
            });
            /* by class/id containing "lovable" */
            document.querySelectorAll('[class*="lovable" i],[id*="lovable" i],[data-lovable]').forEach(function (el) {
              el.style.cssText = 'display:none!important';
            });
          } catch (e) {}
        }

        /* 3. Run at every lifecycle stage */
        purge();
        [0, 100, 300, 600, 1000, 2000, 4000].forEach(function (ms) { setTimeout(purge, ms); });
        window.addEventListener('load', purge);
        document.addEventListener('DOMContentLoaded', purge);

        /* 4. Persistent mutation observer */
        var obs = new MutationObserver(function () { purge(); });
        function watch() {
          obs.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'id', 'href'] });
        }
        if (document.body) { watch(); } else { document.addEventListener('DOMContentLoaded', watch); }
      })();
    </script>
  </body>
</html>
